name: Extract Ghost Browser Foundation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ghost-browser-foundation-maintenance
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete Chromium runs
        run: |
          set -euo pipefail
          for run_id in 37552502468 37558783924 37558809849; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel")"
            echo "Cancel request for $run_id -> HTTP $code"
          done
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract foundation package
        run: |
          set -euo pipefail
          ZIP="GhostBrowser-real-foundation.zip"
          if [ ! -f "$ZIP" ]; then
            echo "Foundation ZIP already extracted."
            exit 0
          fi

          rm -rf /tmp/ghost-foundation
          mkdir -p /tmp/ghost-foundation
          unzip -q "$ZIP" -d /tmp/ghost-foundation

          ROOT="/tmp/ghost-foundation/GhostBrowser-real-foundation"
          test -f "$ROOT/README.md"
          test -f "$ROOT/branding/ghost-browser-logo.png"

          cp -a "$ROOT"/. .
          rm -f "$ZIP"

      - name: Commit extracted foundation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extraction changes needed."
            exit 0
          fi
          git commit -m "Extract Ghost Browser real foundation"
          git push
