name: Build Ghost Browser Chromium Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-debug-apk.sh'
      - '.github/workflows/build-chromium-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out Ghost Browser
        uses: actions/checkout@v4

      - name: Install base build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang curl git lld ninja-build pkg-config python3 python3-pip python3-setuptools python-is-python3 unzip zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/brave/package.json

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      - name: Fetch and initialize Brave/Chromium
        run: |
          chmod +x scripts/bootstrap.sh
          ./scripts/bootstrap.sh

      - name: Install Chromium Android build dependencies
        working-directory: src/brave
        run: |
          ./src/build/install-build-deps.sh --android

      - name: Build Android Debug APK
        working-directory: src/brave
        env:
          JAVA_OPTS: -Xmx10G -Xms1G
        run: |
          pnpm run build Debug --target_os=android --target_arch=arm --target_android_output_format=apk

      - name: Verify APK output
        run: |
          set -euo pipefail
          find src/brave/src/out -type f -name '*.apk' -print
          test -n "$(find src/brave/src/out -type f -name '*.apk' -print -quit)"

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ghost-browser-android-debug-apk
          path: src/brave/src/out/**/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build manifest
        uses: actions/upload-artifact@v4
        with:
          name: ghost-browser-build-manifest
          path: |
            src/brave/package.json
            src/brave/DEPS
          if-no-files-found: error
          retention-days: 7
