name: Build Ghost Browser Chromium Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-debug-apk.sh'
      - 'scripts/bootstrap.sh'
      - '.github/workflows/build-chromium-android.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: ghost-browser-android-foundation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GIT_CACHE_PATH: ${{ runner.temp }}/ghost-git-cache
      GCLIENT_JOBS: 12
      PNPM_STORE_DIR: ${{ runner.temp }}/pnpm-store
      OLD_RUNS_TO_CANCEL: "37552502468 37558783924 37558809849"
    timeout-minutes: 360
    steps:
      - name: Check out Ghost Browser
        uses: actions/checkout@v5

      - name: Install base build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang curl git jq lld ninja-build pkg-config python3 python3-pip python3-setuptools python-is-python3 unzip zip

      - name: Cancel previous Chromium initialization
        run: |
          set -euo pipefail
          for run_id in ${OLD_RUNS_TO_CANCEL}; do
            [[ "$run_id" == "${GITHUB_RUN_ID}" ]] && continue
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel")"
            case "$code" in
              202|409|404) echo "Cancel request for $run_id returned HTTP $code." ;;
              *) echo "Unexpected cancel response for $run_id: HTTP $code"; exit 1 ;;
            esac
          done
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Clean old Ghost Browser artifacts
        run: |
          set -euo pipefail
          curl -fsSL             -H 'Accept: application/vnd.github+json'             -H "Authorization: Bearer ${GITHUB_TOKEN}"             -H 'X-GitHub-Api-Version: 2026-03-10'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" |
            jq -r '.artifacts[] | select(.name | startswith("ghost-browser-")) | .id' |
            while read -r artifact_id; do
              [[ -z "$artifact_id" ]] && continue
              curl -fsSL -X DELETE                 -H 'Accept: application/vnd.github+json'                 -H "Authorization: Bearer ${GITHUB_TOKEN}"                 -H 'X-GitHub-Api-Version: 2026-03-10'                 "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
              echo "Deleted artifact $artifact_id"
            done
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Restore Chromium/Brave Git cache
        id: chromium-git-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.GIT_CACHE_PATH }}
          key: ${{ runner.os }}-ghost-browser-chromium-git-v2-${{ hashFiles('scripts/bootstrap.sh') }}
          restore-keys: |
            ${{ runner.os }}-ghost-browser-chromium-git-v2-

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_DIR }}
          key: ${{ runner.os }}-ghost-browser-pnpm-${{ hashFiles('src/brave/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-ghost-browser-pnpm-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify Node.js
        run: |
          node --version
          npm --version

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      - name: Fetch and initialize Brave/Chromium
        run: |
          chmod +x scripts/bootstrap.sh
          ./scripts/bootstrap.sh

      - name: Install Chromium Android build dependencies
        working-directory: src/brave
        run: |
          ./src/build/install-build-deps.sh --android

      - name: Build Android Debug APK
        working-directory: src/brave
        env:
          JAVA_OPTS: -Xmx10G -Xms1G
        run: |
          pnpm run build Debug --target_os=android --target_arch=arm --target_android_output_format=apk

      - name: Verify APK output
        run: |
          set -euo pipefail
          find src/brave/src/out -type f -name '*.apk' -print
          test -n "$(find src/brave/src/out -type f -name '*.apk' -print -quit)"

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ghost-browser-android-debug-apk
          path: src/brave/src/out/**/*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload build manifest
        uses: actions/upload-artifact@v4
        with:
          name: ghost-browser-build-manifest
          path: |
            src/brave/package.json
            src/brave/DEPS
          if-no-files-found: error
          retention-days: 1
