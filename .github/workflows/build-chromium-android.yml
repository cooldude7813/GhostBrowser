name: Build Ghost Browser Chromium Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build-debug-apk.sh'
      - 'scripts/bootstrap.sh'
      - '.github/workflows/build-chromium-android.yml'

permissions:
  contents: read

concurrency:
  group: ghost-browser-android-foundation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GIT_CACHE_PATH: .ghost-git-cache
      PNPM_STORE_DIR: .pnpm-store
      CHROME_HEADLESS: 1
    steps:
      - name: Check out Ghost Browser
        uses: actions/checkout@v5

      - name: Install base build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang curl git jq lld ninja-build pkg-config python3 python3-pip python3-setuptools python-is-python3 unzip zip

      - name: Restore Chromium/Brave Git cache
        id: chromium-git-cache
        uses: actions/cache@v4
        with:
          path: .ghost-git-cache
          key: \${{ runner.os }}-ghost-browser-chromium-git-v3
          restore-keys: |
            \${{ runner.os }}-ghost-browser-chromium-git-v3-

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: \${{ runner.os }}-ghost-browser-pnpm-v2
          restore-keys: |
            \${{ runner.os }}-ghost-browser-pnpm-v2-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify Node.js
        run: |
          node --version
          npm --version

      - name: Enable Corepack
        run: |
          corepack enable
          corepack --version

      - name: Fetch and initialize Brave/Chromium
        run: |
          chmod +x scripts/bootstrap.sh
          ./scripts/bootstrap.sh

      - name: Verify Chromium workspace
        run: |
          set -euo pipefail
          test -d src
          test -d src/brave
          test -f .gclient
          test -f src/brave/package.json
          test -f src/build/install-build-deps.sh

      - name: Install Chromium Android build dependencies
        run: |
          ./src/build/install-build-deps.sh --android

      - name: Build Android Debug APK
        working-directory: src/brave
        env:
          JAVA_OPTS: -Xmx10G -Xms1G
        run: |
          pnpm run build Debug --target_os=android --target_arch=arm --target_android_output_format=apk

      - name: Verify APK output
        run: |
          set -euo pipefail
          find src/out -type f -name '*.apk' -print
          test -n "$(find src/out -type f -name '*.apk' -print -quit)"

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ghost-browser-android-debug-apk
          path: src/out/**/*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload build manifest
        uses: actions/upload-artifact@v4
        with:
          name: ghost-browser-build-manifest
          path: |
            src/brave/package.json
            src/brave/DEPS
          if-no-files-found: error
          retention-days: 1
